<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b152d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Blue / Cyan Gradients -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="50%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="bubbleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0051C7" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="bubbleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C759" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#248A3D" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#007AFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
    .pulse-bubble { animation: floatBubble 5s ease-in-out infinite alternate; }
    .pulse-bubble-2 { animation: floatBubble2 6s ease-in-out infinite alternate; }
    .stream-beam { stroke-dasharray: 8 16; animation: dash 2.5s linear infinite; }
    .radar-pulse { animation: radar 3.5s ease-out infinite; }
    .status-dot { animation: blink 2s ease-in-out infinite alternate; }

    @keyframes floatBubble {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-12px) scale(1.03); }
    }
    @keyframes floatBubble2 {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(10px) scale(0.97); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -48; }
    }
    @keyframes radar {
      0% { r: 10px; opacity: 0.8; }
      100% { r: 60px; opacity: 0; }
    }
    @keyframes blink {
      0% { opacity: 0.4; }
      100% { opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Geometric Grid Background Pattern -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Glowing Background Network / Relay Streams (Deep Background) -->
  <g opacity="0.45">
    <path d="M 60 180 Q 300 80 600 180 T 1140 180" fill="none" stroke="url(#blueGlow)" stroke-width="2" class="stream-beam" />
    <path d="M 60 220 Q 350 310 650 200 T 1140 140" fill="none" stroke="#38BDF8" stroke-width="1.5" class="stream-beam" style="animation-duration: 3.5s;" />
    
    <!-- Animated Radar Pulse Rings in Background Corners -->
    <circle cx="1090" cy="80" r="15" fill="none" stroke="#007AFF" stroke-width="1.5" class="radar-pulse" />
    <circle cx="110" cy="280" r="15" fill="none" stroke="#38BDF8" stroke-width="1.5" class="radar-pulse" style="animation-delay: 1.5s;" />
  </g>

  <!-- Ambient Floating Chat Bubble Graphics (Side Accent) -->
  <g opacity="0.75" class="pulse-bubble" transform="translate(1000, 160)">
    <!-- iMessage Blue Bubble -->
    <rect x="0" y="0" width="130" height="42" rx="18" fill="url(#bubbleGrad1)" filter="url(#softGlow)" />
    <path d="M 120 32 C 124 38 132 44 136 44 C 131 43 125 38 123 35 Z" fill="#0051C7" />
    <text x="65" y="26" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">iMessage SDK ⚡</text>
  </g>

  <g opacity="0.7" class="pulse-bubble-2" transform="translate(60, 70)">
    <!-- SMS Green Bubble -->
    <rect x="0" y="0" width="125" height="38" rx="16" fill="url(#bubbleGrad2)" filter="url(#softGlow)" />
    <path d="M 10 30 C 6 35 -1 40 -5 40 C -1 39 5 35 7 32 Z" fill="#248A3D" />
    <text x="62" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">SMS / RCS API 💬</text>
  </g>

  <!-- Central Foreground Content (Guaranteed Highest z-order & Clarity) -->
  <g id="foreground-content">
    <!-- Top Pill Category Badge -->
    <g transform="translate(600, 72)">
      <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#0f172a" stroke="#007AFF" stroke-width="1.5" filter="url(#softGlow)" />
      <circle cx="-168" cy="0" r="4" fill="#38BDF8" class="status-dot" />
      <text x="10" y="5" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">OMNICHANNEL MESSAGING &amp; iMESSAGE SDKs</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5" text-anchor="middle" filter="url(#glow)">
      Awesome Messaging Automation &amp; iMessage SDK
    </text>

    <!-- Divider Bar with Gradient -->
    <rect x="420" y="190" width="360" height="3" fill="url(#lineGrad)" rx="1.5" />

    <!-- Subtitle / Meta Description -->
    <text x="600" y="235" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
      Curated Ecosystem of Programmable iMessage SDKs, SMS/RCS Gateways, Matrix Bridges &amp; Chat Relays
    </text>

    <!-- Key Capability Tags in Foreground -->
    <g transform="translate(600, 290)">
      <!-- Tag 1 -->
      <g transform="translate(-290, 0)">
        <rect x="0" y="-14" width="130" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="65" y="4" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">📱 iMessage SDKs</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(-145, 0)">
        <rect x="0" y="-14" width="135" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="67" y="4" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">🌐 Matrix Bridges</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(6, 0)">
        <rect x="0" y="-14" width="135" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="67" y="4" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">⚡ SMS/RCS APIs</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(155, 0)">
        <rect x="0" y="-14" width="135" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="67" y="4" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">🤖 AI Agent Bots</text>
      </g>
    </g>
  </g>
</svg>
